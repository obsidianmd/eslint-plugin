name: "CLA Assistant"
on:
    issue_comment:
        types: [created]
    pull_request_target:
        types: [opened, closed, synchronize]

permissions:
    actions: write
    contents: write
    pull-requests: write
    statuses: write

jobs:
    CLAAssistant:
        # issue_comment also fires on issues; only pull requests need a CLA check.
        if: github.event_name == 'pull_request_target' || github.event.issue.pull_request
        runs-on: ubuntu-latest
        steps:
            - name: "CLA Assistant"
              if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
              uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  path-to-signatures: "cla.json"
                  path-to-document: "https://github.com/obsidianmd/obsidian-releases/blob/master/cla.md"
                  branch: "master"
                  allowlist: joethei,liamcain,lishid,tgrosinger,dependabot[bot]
