name: Node.js build

on:
    push:
        branches: ["master"]
    pull_request:
        branches: ["master"]

# Checks out, builds and tests; nothing is written back.
permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [20.x, 22.x, 24.x]
                # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

        steps:
            - uses: actions/checkout@v4
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: "npm"
            - run: npm ci
            - run: npm run build --if-present
            - run: npm test
            # The generated rule docs and README table must match the rules; the
            # Rebuild documentation workflow only regenerates them after merge.
            - run: npm run check:eslint-docs
