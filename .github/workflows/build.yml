name: Node.js build

on:
    push:
        branches: ["master"]
    # Every pull request, including those stacked on a release branch such as
    # chore/release-0.5.0, which a `branches: ["master"]` filter skipped.
    pull_request:

# Checks out, builds and tests; nothing is written back.
permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
                node-version: [20.x, 22.x, 24.x]
                # The peer range is eslint >=9.19.0; the devDependency is 9.x, so
                # ESLint 10 is installed over it.
                eslint: ["9"]
                include:
                    - node-version: 24.x
                      eslint: "10"

        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  persist-credentials: false
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: "npm"
            - run: npm ci
            # @eslint/js has to match: tests/recommendedConfig.test.ts compares the
            # core rules with its recommended set for the installed major. Without
            # --legacy-peer-deps, npm resolves against the eslint ^9 devDependency
            # and refuses @eslint/js 10 (ERESOLVE).
            - name: Use ESLint ${{ matrix.eslint }}
              if: matrix.eslint != '9'
              run: npm install --no-save --legacy-peer-deps "eslint@^${{ matrix.eslint }}" "@eslint/js@^${{ matrix.eslint }}"
            - run: npm run build --if-present
            - run: npm test
            # The generated rule docs and README table must match the rules; the
            # Rebuild documentation workflow only regenerates them after merge.
            - run: npm run check:eslint-docs
              if: matrix.eslint == '9'
