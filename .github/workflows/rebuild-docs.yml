name: "Rebuild documentation"

on:
    push:
        branches: ["master"]
    # Allows manual run if needed
    workflow_dispatch:

# Commits the regenerated docs and pushes them to master.
permissions:
    contents: write

# Two quick pushes to master must not race to push docs commits.
concurrency:
    group: rebuild-docs
    cancel-in-progress: false

jobs:
    docs:
        runs-on: ubuntu-latest

        steps:
            # The push credential is not left in .git/config for the install
            # scripts and the build to read; the push step passes it itself.
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  persist-credentials: false
            - name: Use Node.js 22
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: 22.x
                  cache: "npm"
            - run: npm ci
            - run: npm run build --if-present
            - run: npm run init:eslint-docs
            - run: npm run update:eslint-docs
            - run: npm run check:eslint-docs
            # Only the generated docs, not whatever else the build left behind.
            - env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  git config --local user.name 'Obsidian Bot'
                  git config --local user.email 'admin@obsidian.md'
                  git add README.md docs
                  git commit -m "chore: Update documentation" || exit 0
                  git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:master
